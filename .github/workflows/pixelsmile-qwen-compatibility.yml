name: PixelSmile Qwen LoRA compatibility preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  metadata_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore saved PixelSmile weights (no Qwen weight download)
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          run-id: '37907852786'
          github-token: ${{ github.token }}
          path: restored
      - name: Download ONLY Qwen transformer config.json
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url = "https://huggingface.co/Qwen/Qwen-Image-Edit-2511/resolve/main/transformer/config.json"
          req = urllib.request.Request(url, headers={"User-Agent":"PhotoForge-compatibility-preflight"})
          with urllib.request.urlopen(req, timeout=40) as response:
              data = response.read(1024*1024 + 1)
          assert len(data) <= 1024*1024
          Path("qwen-transformer-config.json").write_bytes(data)
          PY
      - name: Check all LoRA A/B and down/up pair dimensions
        run: python scripts/check_pixelsmile_compatibility.py --adapter restored/PixelSmile-preview.safetensors --base-config qwen-transformer-config.json --output compatibility-report.json
      - name: Preserve compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-qwen-compatibility-preflight
          path: compatibility-report.json
          if-no-files-found: warn
          retention-days: 30
