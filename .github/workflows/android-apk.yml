name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit || true)"
          fi
          if [ -z "$MANAGER" ] || [ ! -x "$MANAGER" ]; then
            echo "::error::sdkmanager missing from $SDK"
            exit 1
          fi
          "$MANAGER" --sdk_root="$SDK" --licenses < <(yes || true) > /dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download optional LaMa ONNX weights
        id: lama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 \
            "https://huggingface.co/sapienkit/LaMa-ONNX/resolve/main/lama_fp32.onnx?download=true" \
            -o app/src/main/assets/lama_fp32.onnx &&
            echo "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6  app/src/main/assets/lama_fp32.onnx" | sha256sum -c -; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LaMa unavailable; building APK without optional object removal weights"
            rm -f app/src/main/assets/lama_fp32.onnx
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test LaMa ONNX on CPU
        if: steps.lama.outputs.ready == 'true'
        run: |
          python -m pip install --quiet numpy onnxruntime
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          session = ort.InferenceSession("app/src/main/assets/lama_fp32.onnx", providers=["CPUExecutionProvider"])
          x = np.full((1, 3, 512, 512), .5, dtype=np.float32)
          m = np.zeros((1, 1, 512, 512), dtype=np.float32)
          y = session.run(None, {"image": x, "mask": m})[0]
          assert y.shape == (1, 3, 512, 512) and np.isfinite(y).all()
          print("LaMa CPU smoke test PASS")
          PY
      - name: Run graph ordering and tensor unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Report APK size and checksum
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
