name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download optional LaMa ONNX weights
        id: lama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 \
            "https://huggingface.co/sapienkit/LaMa-ONNX/resolve/main/lama_fp32.onnx?download=true" \
            -o app/src/main/assets/lama_fp32.onnx &&
            echo "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6  app/src/main/assets/lama_fp32.onnx" | sha256sum -c -; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LaMa unavailable; building APK without optional object removal weights"
            rm -f app/src/main/assets/lama_fp32.onnx
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test LaMa ONNX on CPU
        if: steps.lama.outputs.ready == 'true'
        run: |
          python -m pip install --quiet numpy onnxruntime
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          session = ort.InferenceSession("app/src/main/assets/lama_fp32.onnx", providers=["CPUExecutionProvider"])
          x = np.full((1, 3, 512, 512), .5, dtype=np.float32)
          m = np.zeros((1, 1, 512, 512), dtype=np.float32)
          y = session.run(None, {"image": x, "mask": m})[0]
          assert y.shape == (1, 3, 512, 512) and np.isfinite(y).all()
          print("LaMa CPU smoke test PASS")
          PY
      - name: Run graph ordering and tensor unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Report APK size and checksum
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
