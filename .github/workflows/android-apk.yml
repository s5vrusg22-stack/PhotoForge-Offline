name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify licensed LaMa ONNX weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 30 \
            "https://huggingface.co/sapienkit/LaMa-ONNX/resolve/main/lama_fp32.onnx?download=true" \
            -o app/src/main/assets/lama_fp32.onnx
          echo "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6  app/src/main/assets/lama_fp32.onnx" | sha256sum -c -
      - name: Smoke-test ONNX inference on CPU
        run: |
          python -m pip install --quiet numpy onnxruntime
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          path = "app/src/main/assets/lama_fp32.onnx"
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          print("Inputs:", [(x.name, x.shape) for x in session.get_inputs()])
          print("Outputs:", [(x.name, x.shape) for x in session.get_outputs()])
          x = np.full((1, 3, 512, 512), 0.5, dtype=np.float32)
          m = np.zeros((1, 1, 512, 512), dtype=np.float32)
          m[:, :, 200:300, 200:300] = 1.0
          y = session.run(None, {"image": x, "mask": m})[0]
          assert y.shape == (1, 3, 512, 512), y.shape
          assert np.isfinite(y).all()
          print("LaMa CPU smoke test PASS", y.min(), y.max())
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
