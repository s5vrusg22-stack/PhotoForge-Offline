name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit || true)"
          fi
          if [ -z "$MANAGER" ] || [ ! -x "$MANAGER" ]; then
            echo "::error::sdkmanager missing from $SDK"
            exit 1
          fi
          "$MANAGER" --sdk_root="$SDK" --licenses < <(yes || true) > /dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build environment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-35" | head
      - name: Download and verify LaMa ONNX model
        id: lama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          MODEL="app/src/main/assets/lama_fp32.onnx"
          URL="https://huggingface.co/sapienkit/LaMa-ONNX/resolve/main/lama_fp32.onnx?download=true"
          if curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 "$URL" -o "$MODEL" &&
             echo "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6  $MODEL" | sha256sum -c -; then
            echo "bundled=true" >> "$GITHUB_OUTPUT"
            ls -lh "$MODEL"
          else
            rm -f "$MODEL"
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LaMa model could not be verified. APK will build without bundled AI weights; import ONNX manually."
          fi
      - name: Smoke-test bundled LaMa model
        if: steps.lama.outputs.bundled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy onnxruntime
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          path = "app/src/main/assets/lama_fp32.onnx"
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          names = [x.name for x in session.get_inputs()]
          assert len(names) == 2 and any("mask" in n.lower() for n in names), names
          feeds = {}
          for inp in session.get_inputs():
              is_mask = "mask" in inp.name.lower()
              shape = [1, 1 if is_mask else 3, 512, 512]
              feeds[inp.name] = np.zeros(shape, dtype=np.float32)
          output = session.run(None, feeds)
          assert output and np.isfinite(output[0]).all(), "Non-finite model output"
          print("LaMa ONNX CPU inference PASS", output[0].shape)
          PY
      - name: Build debug APK first
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build-debug.log
      - name: Upload compile failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-build-error-log
          path: build-debug.log
          if-no-files-found: warn
      - name: Verify installable APK package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -qx "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -Eq "^classes([0-9]+)?\\.dex$"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
      - name: Report APK size and checksum
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  unit-tests:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure SDK for test compilation
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          "$MANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Run JVM unit tests independently
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest 2>&1 | tee unit-tests.log
      - name: Upload unit-test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoForge-unit-test-error-log
          path: unit-tests.log
          if-no-files-found: warn
