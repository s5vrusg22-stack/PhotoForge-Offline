name: Qwen PixelSmile real module shape and LoRA injection smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model architecture libraries
        run: python -m pip install --quiet 'torch>=2.4' 'diffusers>=0.35' 'transformers>=4.51,<5' 'accelerate>=1.0' safetensors
      - name: Restore previously saved original LoRA
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          run-id: '37907852786'
          github-token: ${{ github.token }}
          path: restored
      - name: Fetch tiny transformer config only
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url="https://huggingface.co/Qwen/Qwen-Image-Edit-2511/resolve/main/transformer/config.json"
          with urllib.request.urlopen(url,timeout=45) as r:
              data=r.read(1048577)
          assert len(data)<=1048576
          Path("qwen-transformer-config.json").write_bytes(data)
          PY
      - name: Compare real Qwen module shapes and inject LoRA into CPU test layer
        run: python scripts/test_qwen_pixelsmile_injection.py --adapter restored/PixelSmile-preview.safetensors --config qwen-transformer-config.json --output qwen-lora-injection-report.json
      - name: Save detailed result even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-pixelsmile-injection-smoke-report
          path: qwen-lora-injection-report.json
          if-no-files-found: warn
          retention-days: 30
