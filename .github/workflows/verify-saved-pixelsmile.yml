name: Verify saved PixelSmile tensors and source SHA256
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --quiet numpy
      - name: Restore original safetensors
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          run-id: '37907852786'
          github-token: ${{ github.token }}
          path: original
      - name: Restore converted FP16 bundle
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-fp16-verified
          run-id: '37908864782'
          github-token: ${{ github.token }}
          path: converted
      - name: Verify source SHA256 and every tensor shape and dtype
        run: python scripts/verify_saved_pixelsmile.py --original original/PixelSmile-preview.safetensors --bundle converted/pixelsmile-lora-fp16.npz --report converted/adapter-conversion-report.json --output verification-report.json
      - name: Save independent verification report
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-independent-verification
          path: verification-report.json
          retention-days: 30
          if-no-files-found: error
