name: Expression model readiness
on:
  workflow_dispatch:
    inputs:
      download_weights:
        description: "Download very large Qwen base and PixelSmile adapter weights (requires sufficient disk)"
        required: true
        type: boolean
        default: false
      confirm_large_download:
        description: "Type DOWNLOAD_54GB to permit a fresh download; otherwise use saved-artifact verification"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata tools
        run: python -m pip install --quiet huggingface_hub safetensors numpy
      - name: Test BF16 conversion without downloading models
        run: python scripts/test_expression_conversion.py
      - name: Inspect model repositories and available files
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          for repo in ("PixelSmile/PixelSmile", "Qwen/Qwen-Image-Edit-2511"):
              info = HfApi().model_info(repo, files_metadata=True)
              print("MODEL:", repo, "license:", info.card_data.get("license") if info.card_data else None)
              for f in info.siblings:
                  print("FILE:", f.rfilename, "bytes:", getattr(f, "size", None))
          PY
      - name: Prepare download manifest
        run: python scripts/prepare_expression_model.py
      - name: Block accidental 54GB re-download
        if: ${{ inputs.download_weights }}
        env:
          CONFIRM: ${{ inputs.confirm_large_download }}
        run: |
          if [ "$CONFIRM" != "DOWNLOAD_54GB" ]; then
            echo "::error::54GB download blocked. Use verify-saved-pixelsmile workflow to reuse stored weights, or explicitly type DOWNLOAD_54GB."
            exit 1
          fi
      - name: Download expression model weights (opt-in)
        if: ${{ inputs.download_weights }}
        run: python scripts/prepare_expression_model.py --download
      - name: Preserve PixelSmile adapter immediately after download
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          path: models/expression/adapter/PixelSmile-preview.safetensors
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Disk usage after download
        if: ${{ inputs.download_weights }}
        run: |
          df -h
          du -sh models/expression/* 2>/dev/null || true
      - name: Inspect actual model architecture and adapter tensors
        if: ${{ inputs.download_weights }}
        run: python scripts/inspect_expression_architecture.py
      - name: Convert PixelSmile LoRA tensor weights to FP16 bundle and verify
        if: ${{ inputs.download_weights }}
        run: python scripts/convert_pixelsmile_adapter.py
      - name: Preserve converted FP16 LoRA tensor bundle
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-lora-fp16-bundle
          path: |
            models/expression/pixelsmile-lora-fp16.npz
            models/expression/adapter-conversion-report.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve model architecture report
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: expression-architecture-report
          path: models/expression/architecture-report.json
          if-no-files-found: error
      - name: Report current mobile inference gate
        run: |
          echo "Weights metadata checked. Android conversion and on-device inference NOT performed."
          echo "A full PixelSmile/Qwen diffusion pipeline is not implemented in the app."
      - uses: actions/upload-artifact@v4
        with:
          name: expression-model-manifest
          path: models/expression/manifest.json

  verify_saved_fp16:
    needs: inspect
    if: ${{ inputs.download_weights && needs.inspect.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download stored FP16 weights
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-lora-fp16-bundle
          path: restored
      - name: Verify restored archive against recorded SHA256
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          base = Path("restored")
          archive = base / "pixelsmile-lora-fp16.npz"
          report = json.loads((base / "adapter-conversion-report.json").read_text())
          sha = hashlib.sha256()
          with archive.open("rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  sha.update(chunk)
          assert sha.hexdigest() == report["sha256"], "Restored file SHA256 mismatch"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "Restored ZIP CRC mismatch"
              manifest = json.loads(z.read("manifest.json"))
              tensors = manifest["tensors"]
              assert len(tensors) == report["tensor_count"] and tensors
              for item in tensors:
                  assert item["path"] in z.namelist()
          print("RESTORE VERIFIED:", len(tensors), "tensors; SHA256", sha.hexdigest())
          PY
