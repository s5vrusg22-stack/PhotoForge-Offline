name: Expression model readiness
on:
  workflow_dispatch:
    inputs:
      download_weights:
        description: "Download very large Qwen base and PixelSmile adapter weights (requires sufficient disk)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata tools
        run: python -m pip install --quiet huggingface_hub safetensors
      - name: Inspect model repositories and available files
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          for repo in ("PixelSmile/PixelSmile", "Qwen/Qwen-Image-Edit-2511"):
              info = HfApi().model_info(repo, files_metadata=True)
              print("MODEL:", repo, "license:", info.card_data.get("license") if info.card_data else None)
              for f in info.siblings:
                  print("FILE:", f.rfilename, "bytes:", getattr(f, "size", None))
          PY
      - name: Prepare download manifest
        run: python scripts/prepare_expression_model.py
      - name: Download expression model weights (opt-in)
        if: ${{ inputs.download_weights }}
        run: python scripts/prepare_expression_model.py --download
      - name: Report current mobile inference gate
        run: |
          echo "Weights metadata checked. Android conversion and on-device inference NOT performed."
          echo "A full PixelSmile/Qwen diffusion pipeline is not implemented in the app."
      - uses: actions/upload-artifact@v4
        with:
          name: expression-model-manifest
          path: models/expression/manifest.json
