name: Expression model readiness
on:
  workflow_dispatch:
    inputs:
      download_weights:
        description: "Download very large Qwen base and PixelSmile adapter weights (requires sufficient disk)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata tools
        run: python -m pip install --quiet huggingface_hub safetensors numpy
      - name: Inspect model repositories and available files
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          for repo in ("PixelSmile/PixelSmile", "Qwen/Qwen-Image-Edit-2511"):
              info = HfApi().model_info(repo, files_metadata=True)
              print("MODEL:", repo, "license:", info.card_data.get("license") if info.card_data else None)
              for f in info.siblings:
                  print("FILE:", f.rfilename, "bytes:", getattr(f, "size", None))
          PY
      - name: Prepare download manifest
        run: python scripts/prepare_expression_model.py
      - name: Download expression model weights (opt-in)
        if: ${{ inputs.download_weights }}
        run: python scripts/prepare_expression_model.py --download
      - name: Inspect actual model architecture and adapter tensors
        if: ${{ inputs.download_weights }}
        run: python scripts/inspect_expression_architecture.py
      - name: Convert PixelSmile LoRA tensor weights to FP16 bundle and verify
        if: ${{ inputs.download_weights }}
        run: python scripts/convert_pixelsmile_adapter.py
      - name: Preserve converted FP16 LoRA tensor bundle
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-lora-fp16-bundle
          path: |
            models/expression/pixelsmile-lora-fp16.npz
            models/expression/adapter-conversion-report.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve PixelSmile adapter
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          path: models/expression/adapter/PixelSmile-preview.safetensors
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Preserve model architecture report
        if: ${{ inputs.download_weights }}
        uses: actions/upload-artifact@v4
        with:
          name: expression-architecture-report
          path: models/expression/architecture-report.json
          if-no-files-found: error
      - name: Report current mobile inference gate
        run: |
          echo "Weights metadata checked. Android conversion and on-device inference NOT performed."
          echo "A full PixelSmile/Qwen diffusion pipeline is not implemented in the app."
      - uses: actions/upload-artifact@v4
        with:
          name: expression-model-manifest
          path: models/expression/manifest.json
