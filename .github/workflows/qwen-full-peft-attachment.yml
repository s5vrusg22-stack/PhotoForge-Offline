name: Qwen full-transformer PixelSmile PEFT attachment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen and PEFT tooling
        run: python -m pip install --quiet 'torch>=2.4' 'diffusers>=0.35' 'transformers>=4.51,<5' 'accelerate>=1.0' 'peft>=0.17' safetensors
      - name: Restore saved PixelSmile adapter only
        uses: actions/download-artifact@v4
        with:
          name: pixelsmile-adapter-weights
          run-id: '37907852786'
          github-token: ${{ github.token }}
          path: restored
      - name: Download Qwen config only (not model weights)
        run: |
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          u="https://huggingface.co/Qwen/Qwen-Image-Edit-2511/resolve/main/transformer/config.json"
          with urllib.request.urlopen(u,timeout=45) as r: data=r.read(1048577)
          assert len(data)<=1048576
          Path("qwen-transformer-config.json").write_bytes(data)
          PY
      - name: Inject and populate PEFT adapters across all Qwen transformer modules
        run: python scripts/test_qwen_full_peft_attachment.py --adapter restored/PixelSmile-preview.safetensors --config qwen-transformer-config.json --output full-peft-attachment-report.json
      - name: Archive report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-full-peft-attachment-report
          path: full-peft-attachment-report.json
          retention-days: 30
          if-no-files-found: warn
